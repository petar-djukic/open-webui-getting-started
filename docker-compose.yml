services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data

  open-terminal:
    build: .
    image: open-terminal-gh
    container_name: open-terminal
    restart: unless-stopped
    volumes:
      - open-terminal:/home/user
      - ${HOME}/${WORKSPACE:?set WORKSPACE in .env}:/home/user/${WORKSPACE}
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:?run ./terminals.sh sync}
      - GIT_AUTHOR_NAME=${GIT_USER_NAME:?set GIT_USER_NAME in .env}
      - GIT_AUTHOR_EMAIL=${GIT_USER_EMAIL:?set GIT_USER_EMAIL in .env}
      - GIT_COMMITTER_NAME=${GIT_USER_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_USER_EMAIL}
      - GH_TOKEN=${GH_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITLAB_HOST=${GITLAB_HOST:-gitlab.com}

volumes:
  open-webui:
  open-terminal:
